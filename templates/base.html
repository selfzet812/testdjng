<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FlowBoard — Управление проектами и задачами{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        surface: {
                            900: '#090b10',
                            800: '#11151f',
                            700: '#181e2c',
                            600: '#232b3e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090b10;
            background-image:
                radial-gradient(at 15% 10%, rgba(99, 102, 241, 0.12) 0px, transparent 45%),
                radial-gradient(at 85% 5%, rgba(16, 185, 129, 0.08) 0px, transparent 40%);
            background-attachment: fixed;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090b10;
        }
        ::-webkit-scrollbar-thumb {
            background: #232b3e;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
    {% block body %}{% endblock %}
</body>
</html>
